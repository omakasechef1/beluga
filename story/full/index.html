:root{--c:#7df9ff;--cg:rgba(125,249,255,.55);--pw:#6464ff;--body:#e8eef0;--bg:#030507}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;color:var(--body)}
#stage{position:fixed;inset:0;background:#000}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;pointer-events:none;background:#000}
#stage iframe.act{pointer-events:auto}
#hot{position:fixed;left:0;right:0;bottom:0;height:16px;z-index:40;display:none}
body.clean #hot{display:block}
#bar{position:fixed;z-index:50;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 18px;background:rgba(3,5,7,.78);
 border-top:1px solid rgba(125,249,255,.18);font-size:12px;transition:opacity .35s,transform .35s}
body.clean #bar{opacity:0;transform:translateY(100%);pointer-events:none}
body.clean.peek #bar{opacity:1;transform:none;pointer-events:auto}
#bar button{font:600 12px 'JetBrains Mono',monospace;color:var(--c);background:rgba(3,5,7,.6);border:1px solid rgba(125,249,255,.6);border-radius:3px;padding:4px 10px;cursor:pointer;
 text-shadow:0 0 8px var(--cg);box-shadow:0 0 8px rgba(125,249,255,.1);white-space:nowrap}
#bar button:hover{background:rgba(125,249,255,.08)}
#bar button.on{background:rgba(125,249,255,.16)}
#bar button.off{opacity:.5}
#play{min-width:72px}
#tl{position:relative;flex:1 1 auto;height:26px;display:flex;gap:3px;cursor:pointer;touch-action:none;user-select:none;min-width:200px}
#tl .seg{position:relative;flex:1 1 0;min-width:0;height:100%;border:1px solid rgba(125,249,255,.28);border-radius:2px;background:rgba(125,249,255,.04);overflow:hidden}
#tl .seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(72,108,255,.32);box-shadow:inset -1px 0 0 rgba(125,249,255,.6)}
#tl .seg span{position:absolute;left:6px;right:4px;top:0;bottom:0;display:flex;align-items:center;font:500 10.5px/1 'JetBrains Mono',monospace;color:#9fb0b8;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#tl .seg span b{color:var(--pw);font-weight:600;margin-right:5px;text-shadow:0 0 6px rgba(100,100,255,.7)}
#tl .seg.cur{border-color:rgba(125,249,255,.7);box-shadow:0 0 8px rgba(125,249,255,.15)}
#tl .seg.cur span{color:var(--c);text-shadow:0 0 8px var(--cg)}
#tl .seg:hover{background:rgba(125,249,255,.09)}
#head{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--c);box-shadow:0 0 6px var(--cg);pointer-events:none;left:0}
#tt{min-width:104px;text-align:right;font-variant-numeric:tabular-nums;color:var(--c);text-shadow:0 0 6px var(--cg)}
#speed{width:80px;accent-color:#486cff}
#slab{min-width:44px;font-variant-numeric:tabular-nums;color:#9fb0b8}
#endc{position:fixed;z-index:45;right:22px;bottom:60px;opacity:0;pointer-events:none;transition:opacity .8s}
#endc.show{opacity:1;pointer-events:auto}
#endc button{font:600 13px 'JetBrains Mono',monospace;color:var(--c);background:rgba(3,5,7,.8);border:1px solid rgba(125,249,255,.6);border-radius:3px;padding:7px 14px;cursor:pointer;text-shadow:0 0 8px var(--cg)}
body.clean #endc{bottom:22px}
#help{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(3,5,7,.92);border:1px solid rgba(125,249,255,.4);padding:14px 18px;font-size:12.5px;line-height:1.7;color:var(--body)}
#help b{color:var(--c);font-weight:600}
#help.show{display:block}

<div id="hot"></div>
<div id="endc"><button id="again" title="back to the Moon launch (Home)">↺ back to start</button></div>
<div id="help"><b>Space</b> play / pause (or continue a step hold) · <b>← →</b> previous / next chapter · <b>Home</b> back to start<br>

<div id="bar">
 <button id="play" title="play / pause (Space)">PLAY</button>
 <div id="tl" title="chapters: click or drag to jump"><div id="head"></div></div>

 <button id="rp" title="read pace: ease playback while a caption is read">read pace</button>
 <button id="st" title="step: pause at each caption until Space / click">step</button>
 <button id="cl" title="clean view (C)">clean</button>
 <button id="hb" title="keys (?)">?</button>
</div>
<script>'use strict';
// story_full.html · one continuous player for the five sections. Two stacked full-window iframes: the active section plays,
// the next one waits paused on its t=0 (= this section's last frame). When the active one reports 'ended' (story t >= DUR,
// so read-pace slow-downs don't matter) it is frozen on its last frame and the next one starts and fades in over it (0.6 s),
// then the old frame preloads the chapter after. Control goes through postMessage to embed.js inside each section.
(()=>{
const CH=[
 {n:'Moon launch',src:'moon_bridge_story.html',dur:25},
 {n:'Arrival',src:'02_arrival.html',dur:38},
 {n:'Growth & shell',src:'section_b_shell.html',dur:60},
 {n:'Retirement',src:'section_d_retire.html',dur:55},
 {n:'The shell talks to Earth',src:'section_e_comms.html',dur:74}];   // E's DUR is replaced by the value it reports
const Q=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SMIN=.1,SMAX=3;
let speed=clamp(parseFloat(Q.get('speed'))||1,SMIN,SMAX),readPace=Q.get('readpace')!=='0',step=Q.get('step')==='1',clean=clamp(parseInt(Q.get('clean'))||0,0,2);
const FADE=Q.has('fade')?clamp(parseFloat(Q.get('fade'))||0,0,3):.6,JUMPFADE=Math.min(FADE,.3);
let wantPlay=Q.get('paused')!=='1'&&Q.get('autoplay')!=='0';
const $=id=>document.getElementById(id);
const F=[0,1].map(i=>({i,el:$('f'+i),ch:-1,ready:false,t:0,DUR:0,playing:false,holding:false,cb:null}));
let A=0,busy=false,atEnd=false,showT=0;
const off=c=>CH.slice(0,c).reduce((s,x)=>s+x.dur,0),total=()=>off(CH.length);
const send=(f,cmd,x)=>{if(f.el.contentWindow)f.el.contentWindow.postMessage(Object.assign({storyCmd:cmd},x||{}),'*');};
const both=(cmd,x)=>F.forEach(f=>{if(f.ready)send(f,cmd,x);});
function url(ch,t){return CH[ch].src+'?'+new URLSearchParams({embed:1,t:(+t||0).toFixed(3),autoplay:0,loop:0,speed:speed.toFixed(3),
 readpace:readPace?1:0,step:step?1:0,clean}).toString();}
function load(fi,ch,t,cb){const f=F[fi];if(fi!==A){f.el.style.transition='none';f.el.style.opacity=0;}f.ch=ch;f.ready=false;f.t=t||0;f.playing=false;f.cb=cb||null;f.el.src=url(ch,t);}
// show frame fi on top, fading it in over the other
function show(fi,fade,done){const n=F[fi].el,o=F[1-fi].el;A=fi;clearTimeout(showT);
 n.classList.add('act');o.classList.remove('act');n.style.zIndex=2;o.style.zIndex=1;
 n.style.transition='none';n.style.opacity=fade>0?0:1;void n.offsetWidth;
 const fin=()=>{if(done)done();};   // the old frame stays under the (opaque) new one until it is reloaded, so a late first paint can't flash black
 if(fade>0){n.style.transition=`opacity ${fade}s linear`;n.style.opacity=1;showT=setTimeout(fin,fade*1000+60);}else fin();
 ui();}
function preloadNext(){const nx=F[A].ch+1,o=F[1-A];if(nx>=CH.length)return;
 if(o.ch===nx&&o.ready){send(o,'play',{v:false});send(o,'seek',{t:0});}else load(1-A,nx,0,null);}
// seamless cut to the next chapter
function advance(){const f=F[A];if(busy)return;
 if(f.ch>=CH.length-1){atEnd=true;wantPlay=false;ui();return;}
 busy=true;send(f,'play',{v:false});send(f,'seek',{t:f.DUR||CH[f.ch].dur});   // freeze on the exact last frame (02 would keep orbiting)
 const nf=1-A,go=()=>{send(F[nf],'start',{t:0});F[nf].playing=true;F[nf].t=0;show(nf,FADE,()=>{busy=false;preloadNext();});};
 if(F[nf].ch===f.ch+1&&F[nf].ready)go();else load(nf,f.ch+1,0,go);}
// jump to chapter ch at local time t
function goTo(ch,t,play){ch=clamp(ch,0,CH.length-1);t=clamp(t||0,0,CH[ch].dur);atEnd=false;wantPlay=play;
 const f=F[A];
 if(f.ch===ch&&f.ready){if(play)send(f,'start',{t});else{send(f,'play',{v:false});send(f,'seek',{t});}f.t=t;ui();return;}
 busy=true;const nf=1-A;
 const go=()=>{const g=F[nf];if(play)send(g,'start',{t});else{send(g,'play',{v:false});send(g,'seek',{t});}g.t=t;send(F[A],'play',{v:false});
  show(nf,JUMPFADE,()=>{busy=false;preloadNext();});};
 if(F[nf].ch===ch&&F[nf].ready)go();else load(nf,ch,t,go);ui();}
function togglePlay(){const f=F[A];if(atEnd){restart();return;}if(busy)return;
 if(f.playing&&!f.holding){send(f,'play',{v:false});wantPlay=false;f.playing=false;}
 else if(f.holding)send(f,'space');
 else{if(f.t>=(f.DUR||CH[f.ch].dur)-1e-3){advance();return;}send(f,'play',{v:true});wantPlay=true;f.playing=true;}
 ui();}
function restart(){atEnd=false;goTo(0,0,true);}
function chapterStep(d){const f=F[A];if(d<0&&f.t>2&&!atEnd)goTo(f.ch,0,wantPlay||f.playing);else goTo(f.ch+d,0,wantPlay||f.playing||atEnd);}
// messages from the sections
addEventListener('message',e=>{const m=e.data;if(!m||!m.story)return;const f=F.find(f=>f.el.contentWindow===e.source);if(!f)return;
 if(m.type==='ready'){f.ready=true;f.DUR=m.DUR;if(f.ch>=0&&Math.abs(CH[f.ch].dur-m.DUR)>1e-6){CH[f.ch].dur=m.DUR;buildTL();}
  if(m.readPace!==null&&m.readPace!==undefined&&m.readPace!==readPace)send(f,'readpace',{v:readPace});
  const cb=f.cb;f.cb=null;if(cb)cb();ui();return;}
 if(m.type==='state'){f.t=m.t;f.playing=m.playing;f.holding=m.holding;if(f.i===A)ui();return;}
 if(m.type==='ended'){if(f.i===A&&!busy)advance();return;}
 if(m.type==='toggle'){if(f.i===A)togglePlay();return;}
 if(m.type==='key')key(m.key,m.code);});
function key(k,code){
 if(code==='Space'||k===' '){if(F[A].holding)send(F[A],'space');else togglePlay();return;}
 if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown')chapterStep(1);
 else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp')chapterStep(-1);
 else if(k==='Home')restart();
 else if(k==='End')goTo(CH.length-1,0,true);
 else if(k==='c'||k==='C')setClean((clean+1)%3);
 else if(k==='Escape'){setClean(0);$('help').classList.remove('show');}
 else if(k==='?')$('help').classList.toggle('show');}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'&&e.code!=='Space'&&/Arrow/.test(e.key))return;
 if(e.code==='Space'||/^(Arrow|Page|Home|End|Escape)/.test(e.key)||/^[cC?]$/.test(e.key)){e.preventDefault();if(!e.repeat)key(e.key,e.code);}});
// timeline
const tl=$('tl'),head=$('head');let segs=[];
function buildTL(){segs.forEach(s=>s.remove());segs=CH.map((c,i)=>{const s=document.createElement('div');s.className='seg';s.style.flexGrow=c.dur;s.title=`${i+1} · ${c.n}`;
 s.innerHTML=`<i></i><span><b>${i+1}</b>${c.n}</span>`;tl.insertBefore(s,head);return s;});ui();}
function posAt(x){const r=tl.getBoundingClientRect();const g=clamp((x-r.left)/r.width,0,1)*total();let c=0;while(c<CH.length-1&&g>=off(c+1))c++;return{c,t:clamp(g-off(c),0,CH[c].dur),g};}
let drag=null;
tl.addEventListener('pointerdown',e=>{tl.setPointerCapture(e.pointerId);const p=posAt(e.clientX);drag={play:wantPlay&&!atEnd||F[A].playing,p};scrubTo(p,false);});
tl.addEventListener('pointermove',e=>{if(!drag)return;drag.p=posAt(e.clientX);scrubTo(drag.p,false);});
const endDrag=e=>{if(!drag)return;const d=drag;drag=null;scrubTo(d.p,true,d.play);};
tl.addEventListener('pointerup',endDrag);tl.addEventListener('pointercancel',endDrag);
function scrubTo(p,final,play){const f=F[A];
 if(p.c===f.ch&&f.ready&&!busy){atEnd=false;send(f,'seek',{t:p.t});f.t=p.t;if(final&&play)send(f,'play',{v:true});ui();}
 else{head.style.left=(100*p.g/total())+'%';if(final)goTo(p.c,p.t,!!play);}}
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');};
function ui(){const f=F[A],ch=Math.max(0,f.ch),t=clamp(f.t||0,0,CH[ch].dur),g=off(ch)+t;
 segs.forEach((s,i)=>{s.classList.toggle('cur',i===ch);s.firstChild.style.width=(i<ch?100:i>ch?0:100*t/CH[ch].dur)+'%';});
 if(!drag)head.style.left=(100*g/total())+'%';
 $('tt').textContent=fmt(g)+' / '+fmt(total());
 $('play').textContent=atEnd?'REPLAY':(f.holding?'NEXT ▸':(f.playing?'PAUSE':'PLAY'));
 $('endc').classList.toggle('show',atEnd);
 $('rp').classList.toggle('on',readPace);$('st').classList.toggle('on',step);$('cl').classList.toggle('on',clean>0);$('cl').textContent=['clean','clean','bare'][clean];
 document.title=`${ch+1}/${CH.length} ${CH[ch].n} · Story`;}
// controls
$('play').onclick=togglePlay;$('again').onclick=restart;$('hb').onclick=()=>$('help').classList.toggle('show');$('help').onclick=()=>$('help').classList.remove('show');
const spEl=$('speed');
function setSpeed(s,fromSlider){speed=clamp(s,SMIN,SMAX);if(Math.abs(Math.log(speed))<.03)speed=1;
 if(!fromSlider)spEl.value=Math.round(1000*Math.log(speed/SMIN)/Math.log(SMAX/SMIN));$('slab').textContent=speed.toFixed(2)+'×';both('speed',{v:speed});}
spEl.oninput=()=>setSpeed(SMIN*Math.pow(SMAX/SMIN,spEl.value/1000),true);setSpeed(speed);
spEl.addEventListener('dblclick',()=>setSpeed(1));
$('rp').onclick=()=>{readPace=!readPace;both('readpace',{v:readPace});ui();};
$('st').onclick=()=>{step=!step;both('step',{v:step});ui();};
$('cl').onclick=()=>setClean((clean+1)%3);
function setClean(c){clean=c;document.body.classList.toggle('clean',c>0);both('clean',{v:c});ui();}
setClean(clean);
// clean view: the bar peeks when the pointer reaches the bottom edge
let peekT=0;const peek=on=>{clearTimeout(peekT);if(on)document.body.classList.add('peek');else peekT=setTimeout(()=>document.body.classList.remove('peek'),900);};
$('hot').addEventListener('pointerenter',()=>peek(true));$('bar').addEventListener('pointerenter',()=>peek(true));$('bar').addEventListener('pointerleave',()=>peek(false));
// start
const ch0=clamp((parseInt(Q.get('chapter'))||1)-1,0,CH.length-1),t0=Math.max(0,parseFloat(Q.get('t'))||0);
buildTL();
load(0,ch0,t0,()=>{F[0].t=Math.min(t0,F[0].DUR);if(wantPlay)send(F[0],'start',{t:t0});show(0,0);setTimeout(preloadNext,800);});
window.__story={CH,F,get A(){return A;},get busy(){return busy;},get atEnd(){return atEnd;},goTo,advance,togglePlay,restart};
})();
</script>
</body></html>
