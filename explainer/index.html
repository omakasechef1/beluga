:root{--ink:#121416;--paper:#f1f0eb;--paper-bright:#faf9f5;--line:#12141629;--muted:#666863;--acid:#e5c9a6;--blue:#486cff;
--head:'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace;--body:'Courier Prime','Courier New',ui-monospace,'DejaVu Sans Mono',monospace;--w:900px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);text-rendering:optimizeLegibility}
.site-header{height:50px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff24;gap:12px}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--head);white-space:nowrap;overflow:hidden}
.wordmark-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 18px #486cffb8;flex:none}
.wordmark strong{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.wordmark small{color:#ffffff80;letter-spacing:.09em;text-transform:uppercase;font-size:10.5px}
.hdr-right{display:flex;align-items:center;gap:10px}
.chip{font-family:var(--head);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#ffffffad;border:1px solid #ffffff26;border-radius:100px;padding:6px 12px;white-space:nowrap}
#auto{font-family:var(--head);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffffc8;background:transparent;border:1px solid #ffffff2b;height:32px;padding:0 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:0}
#auto:hover{border-color:var(--blue);color:#9fb2ff}#auto.on{border-color:var(--blue);color:#9fb2ff;box-shadow:inset 0 0 0 1px #486cff55}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 8px}
.row{width:var(--w);max-width:100%}
.headrow{display:flex;align-items:center;gap:16px;padding-bottom:9px;border-bottom:1px solid var(--ink)}
.num{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-size:10.5px;color:var(--ink);flex:none}
h1{font-family:var(--head);font-weight:300;font-size:27px;letter-spacing:-.035em;line-height:1.05;margin:0;color:#2b2d2f;flex:1}
.kicker{font-family:var(--head);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;white-space:nowrap}
figure{margin:12px 0 0;padding:0}
canvas{display:block;background:var(--ink)}
figcaption{display:flex;justify-content:space-between;gap:16px;padding-top:7px;font-family:var(--head);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
figcaption b{font-weight:500;color:var(--ink)}
.copy{display:grid;grid-template-columns:118px 1fr;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.copy .side{font-family:var(--head);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px;line-height:1.6}
#txt{margin:0;font-size:17.5px;line-height:1.42;color:#3b3d39}
#txt .end{display:block;margin-top:5px;font-style:italic;color:var(--ink)}
#note{margin:7px 0 0;border-left:2px solid var(--blue);padding-left:14px;font-size:13px;line-height:1.38;color:var(--muted)}
#nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{font-family:var(--head);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--paper-bright);color:var(--ink);border:1px solid var(--line);border-radius:100px;padding:9px 18px;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}.btn:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--ink)}
#dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-family:var(--head);font-size:10px;color:var(--muted);padding:0;cursor:pointer}
.dot:hover{border-color:var(--blue);color:var(--blue)}
.dot.on{background:var(--ink);border-color:var(--ink);color:var(--paper-bright);box-shadow:0 0 0 3px #486cff33}
#foot{margin-top:8px;font-family:var(--head);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#8a8b86;text-align:center}
.stage{display:grid;grid-template-columns:1fr}
body.side .stage{grid-template-columns:auto 1fr;gap:22px;align-items:start}
body.side .copy{grid-template-columns:1fr;gap:10px;margin-top:12px;padding:2px 0 0 22px;border-top:none;border-left:1px solid var(--line)}
body.side .copy .side{padding-top:0;border-bottom:1px solid var(--line);padding-bottom:8px}
body.side #txt{font-size:16.5px;line-height:1.42}
body:not(.side) .copy{grid-template-columns:1fr;gap:0}body:not(.side) #txt{font-size:16px;line-height:1.4}body:not(.side) #note{font-size:12.5px}body:not(.side) .copy .side{display:none}
@media (max-height:760px){body:not(.side) #foot{display:none}}
@media (max-width:760px){.wordmark small,.kicker{display:none}h1{font-size:22px}}

.kicker,.copy .side{color:#a59d8e}

#foot{color:#6d695f}

  label('farther: less power, cooler →',X(1.6),528,{align:'center',size:13,color:'#9fb2ff',box:false});

 requestAnimationFrame(frame);}
function setAuto(v){auto=v;autoT0=performance.now();$('auto').classList.toggle('on',v);$('auto').innerHTML=v?'Pause <b>&#10074;&#10074;</b>':'Autoplay <b>&#9654;</b>';$('next').disabled=cur===STEPS.length-1&&!auto;}
$('back').onclick=()=>go(cur-1);$('next').onclick=()=>go(auto?(cur+1)%STEPS.length:cur+1);$('auto').onclick=()=>setAuto(!auto);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}else if(e.key==='a'||e.key==='A')setAuto(!auto);else if(e.key==='Home')go(0);else if(e.key==='End')go(STEPS.length-1);});
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const st=parseInt(q.get('step')||'1',10);
go(isNaN(st)?0:st-1);if(q.get('autoplay')==='1')setAuto(true);
requestAnimationFrame(frame);
</script>
</body></html>
